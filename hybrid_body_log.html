<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111">
<title>Hybrid Body Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:20px;position:sticky;top:0;background:#111;z-index:2;border-bottom:1px solid #333}main{max-width:700px;margin:auto;padding:14px 12px 80px}h1{margin:0;font-size:26px}h2{margin:0 0 8px}.muted{color:#999;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}button{border:0;border-radius:12px;padding:12px;background:#252529;color:white;font-weight:700}.active,.primary{background:#ff5a00}.card{background:#19191c;border:1px solid #303035;border-radius:17px;padding:16px;margin-bottom:12px}.tag{color:#ff8b50;font-size:12px;font-weight:800}.ex{border-top:1px solid #303035;padding:14px 0}.ex:first-child{border-top:0}.exhead{display:flex;justify-content:space-between}.target{color:#ff9b6b;font-size:12px;font-weight:800}.note{color:#999;font-size:12px;margin:5px 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}label{font-size:10px;color:#999}input,textarea{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid #333;background:#0f0f11;color:#fff;font-size:15px}.row{display:flex;gap:8px}.row>*{flex:1}.history{border-top:1px solid #333;padding:10px 0}.empty{text-align:center;color:#999;padding:30px}.danger{background:#442222;color:#ff9999}
</style>
<header><h1>Hybrid Body Log</h1><div class="muted">筋力 × 筋量 × ランニング</div></header>
<main><div class="tabs"><button class="active" onclick="tab('today',this)">今日</button><button onclick="tab('history',this)">履歴</button><button onclick="tab('data',this)">データ</button></div><div id="today"></div><div id="history" style="display:none"></div><div id="data" style="display:none"></div></main>
<script>
const P=[
["A","筋トレ","プッシュ","胸・肩・三頭",[["スミスベンチプレス","3","6–10","2–3分","RIR 1–2"],["インクラインダンベルプレス","3","8–12","90–120秒","胸上部"],["チェストプレス","2","10–15","90秒","最後2–3回がきつい"],["サイドレイズ","3","12–20","60–90秒","反動を抑える"],["ケーブルプレスダウン","3","10–15","60–90秒","肘を固定"],["ケーブルクランチ","2","10–15","60秒","腹部を丸める"]]],
["B","ラン","イージーラン","会話できる強度",[["イージーラン","1","25–35分","—","RPE 4–5"],["ウォーキング","1","5–10分","—","クールダウン"]]],
["C","筋トレ","プル","背中・後肩・二頭",[["ラットプルダウン","3","8–12","90–120秒","胸を張る"],["アシストチンニング","3","6–10","2分","最後1–2回がきつい"],["シーテッドロウ","3","8–12","90–120秒","肩をすくめない"],["ワンハンドロウ","2","10–12/側","90秒","左右差を確認"],["リアデルトフライ","3","12–20","60–90秒","反動を抑える"],["ダンベルカール","3","10–15","60–90秒","肘を固定"]]],
["D","休養","回復","完全休養または軽い散歩",[]],
["E","筋トレ","レッグ","脚・臀部・ランニング耐性",[["スクワット","3","6–10","2–3分","RIR 2・フォーム優先"],["レッグプレス","3","8–12","2分","深さを一定に"],["ルーマニアンデッドリフト","2","8–12","2分","ハム・臀部"],["レッグカール","3","10–15","90秒","ゆっくり戻す"],["レッグエクステンション","2","10–15","90秒","膝に痛みが出ない範囲"],["カーフレイズ","3","12–20","60–90秒","最下部で伸ばす"],["プランク","2","30–60秒","60秒","体幹"]]],
["F","ラン","ランニング","まず5km完走",[["ランニング","1","3–5 km","—","RPE 5–6・距離優先"],["ウォーキング","1","5–10分","—","クールダウン"]]],
["G","筋トレ","フルボディ","余力がある週だけ",[["インクラインスミスベンチ","3","8–12","2分","胸"],["ラットプルダウン","3","8–12","90–120秒","背中"],["レッグプレス","3","10–15","2分","RIR 2–3"],["ショルダープレス","2","8–12","90秒","肩"],["サイドレイズ","2","12–20","60秒","肩中部"],["アームカール","2","10–15","60秒","二頭"],["トライセプスプレスダウン","2","10–15","60秒","三頭"]]]
];
let S=JSON.parse(localStorage.getItem("HBL")||"null")||{i:0,logs:[]};const save=()=>localStorage.setItem("HBL",JSON.stringify(S));
function last(n){return S.logs.find(x=>x.n===n)}
function render(){
let p=P[S.i%P.length],h=`<div class=card><div class=tag>DAY ${p[0]} / ${p[1]}</div><h2>${p[2]}</h2><div class=muted>${p[3]}</div></div>`;
if(!p[4].length)h+=`<div class=card><div class=empty>今日は回復日です。疲れていれば完全休養でOK。</div><button class=primary style="width:100%" onclick=next()>完了 → 次へ</button></div>`;
else{h+=`<div class=card><div class=muted>重量は自分で調整。「指定回数＋RIR 1–3」を基本にしてください。</div>`;
p[4].forEach((e,j)=>{let l=last(e[0]);h+=`<div class=ex><div class=exhead><b>${e[0]}</b><span class=target>${e[2]}</span></div><div class=note>${e[4]}　休憩 ${e[3]}${l?"｜前回 "+l.d:""}</div><div class=grid><label>重量/結果<input id=w${j} placeholder="${p[1]=="筋トレ"?"kg":"結果"}"></label><label>回数/時間<input id=r${j} placeholder="${e[2]}"></label><label>RIR/RPE<input id=q${j} placeholder="${p[1]=="筋トレ"?"例 2":"例 5"}"></label></div></div>`});
h+=`<label>メモ<textarea id=m placeholder="体調・痛み・気づいたこと"></textarea></label><button class=primary style="width:100%;margin-top:12px" onclick=done()>記録して完了 →</button></div>`}
document.getElementById("today").innerHTML=h}
function done(){let p=P[S.i%P.length],date=new Date().toLocaleString("ja-JP");p[4].forEach((e,j)=>{let a=document.getElementById("w"+j).value,b=document.getElementById("r"+j).value,c=document.getElementById("q"+j).value;if(a||b)S.logs.unshift({date,n:e[0],d:(a?a+" × ":"")+b+(c?" / RIR・RPE "+c:""),m:document.getElementById("m").value})});next()}
function next(){S.i=(S.i+1)%P.length;save();render()}
function history(){let h=S.logs.length?S.logs.slice(0,60).map(x=>`<div class=history><b>${x.n}</b><br>${x.d}<br><span class=muted>${x.date}${x.m?"｜"+x.m:""}</span></div>`).join(""):`<div class=empty>まだ記録がありません。</div>`;document.getElementById("history").innerHTML=`<div class=card><h2>最近の記録</h2>${h}</div>`}
function data(){document.getElementById("data").innerHTML=`<div class=card><h2>バックアップ</h2><button onclick=backup()>バックアップを書き出す</button> <button class=danger onclick=reset()>全削除</button><p class=muted>記録はこのSafariに保存されます。SafariのWebサイトデータを消すと記録も消えるため、定期的にバックアップしてください。</p></div>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="hybrid-body-backup.json";a.click()}
function reset(){if(confirm("全記録を削除しますか？")){localStorage.removeItem("HBL");location.reload()}}
function tab(x,b){["today","history","data"].forEach(id=>document.getElementById(id).style.display=id==x?"block":"none");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(x=="history")history();if(x=="data")data()}
render()
</script></html>
