<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Hybrid Body Log</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:20px;position:sticky;top:0;background:#111;z-index:2;border-bottom:1px solid #333}
main{max-width:700px;margin:auto;padding:14px 12px 90px}
h1{margin:0;font-size:26px}h2{margin:0 0 8px}.muted{color:#999;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;background:#252529;color:white;font-weight:700;font-size:14px}
button:active{opacity:.75}.active,.primary{background:#ff5a00}
.secondary{background:#34343a}.danger{background:#442222;color:#ff9999}
.card{background:#19191c;border:1px solid #303035;border-radius:17px;padding:16px;margin-bottom:12px}
.tag{color:#ff8b50;font-size:12px;font-weight:800}.ex{border-top:1px solid #303035;padding:14px 0}.ex:first-child{border-top:0}
.exhead{display:flex;justify-content:space-between;gap:10px}.target{color:#ff9b6b;font-size:12px;font-weight:800}
.note{color:#999;font-size:12px;margin:5px 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
label{font-size:10px;color:#999}input,textarea{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid #333;background:#0f0f11;color:#fff;font-size:15px}
textarea{min-height:72px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}
.history{border-top:1px solid #333;padding:10px 0}.empty{text-align:center;color:#999;padding:30px}
.small{font-size:11px}.success{color:#79e08a}.sharebox{background:#111;border:1px solid #333;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:12px;line-height:1.5;max-height:260px;overflow:auto}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:#111;border-radius:12px;padding:12px}.stat b{font-size:20px}
</style>
</head>
<body>
<header><h1>Hybrid Body Log</h1><div class="muted">筋力 × 筋量 × ランニング</div></header>
<main>
  <div class="tabs">
    <button class="active" onclick="tab('today',this)">今日</button>
    <button onclick="tab('history',this)">履歴</button>
    <button onclick="tab('data',this)">データ</button>
  </div>
  <div id="today"></div>
  <div id="history" style="display:none"></div>
  <div id="data" style="display:none"></div>
</main>

<script>
const P=[

["A","筋トレ","プッシュ","胸・肩・三頭",[["スミスベンチプレス","3","6–10","2–3分","RIR 1–2"],["インクラインダンベルプレス","3","8–12","90–120秒","胸上部"],["チェストプレス","2","10–15","90秒","最後2–3回がきつい"],["サイドレイズ","3","12–20","60–90秒","反動を抑える"],["ケーブルプレスダウン","3","10–15","60–90秒","肘を固定"],["ケーブルクランチ","2","10–15","60秒","腹部を丸める"]]],
["B","ラン","イージーラン","会話できる強度",[["イージーラン","1","25–35分","—","RPE 4–5"],["ウォーキング","1","5–10分","—","クールダウン"]]],
["C","筋トレ","プル","背中・後肩・二頭",[["ラットプルダウン","3","8–12","90–120秒","胸を張る"],["アシストチンニング","3","6–10","2分","最後1–2回がきつい"],["シーテッドロウ","3","8–12","90–120秒","肩をすくめない"],["ワンハンドロウ","2","10–12/側","90秒","左右差を確認"],["リアデルトフライ","3","12–20","60–90秒","反動を抑える"],["ダンベルカール","3","10–15","60–90秒","肘を固定"]]],
["D","休養","回復","完全休養または軽い散歩",[]],
["E","筋トレ","レッグ","脚・臀部・ランニング耐性",[["スクワット","3","6–10","2–3分","RIR 2・フォーム優先"],["レッグプレス","3","8–12","2分","深さを一定に"],["ルーマニアンデッドリフト","2","8–12","2分","ハム・臀部"],["レッグカール","3","10–15","90秒","ゆっくり戻す"],["レッグエクステンション","2","10–15","90秒","膝に痛みが出ない範囲"],["カーフレイズ","3","12–20","60–90秒","最下部で伸ばす"],["プランク","2","30–60秒","60秒","体幹"]]],
["F","ラン","ランニング","まず5km完走",[["ランニング","1","3–5 km","—","RPE 5–6・距離優先"],["ウォーキング","1","5–10分","—","クールダウン"]]],
["G","筋トレ","フルボディ","余力がある週だけ",[["インクラインスミスベンチ","3","8–12","2分","胸"],["ラットプルダウン","3","8–12","90–120秒","背中"],["レッグプレス","3","10–15","2分","RIR 2–3"],["ショルダープレス","2","8–12","90秒","肩"],["サイドレイズ","2","12–20","60秒","肩中部"],["アームカール","2","10–15","60秒","二頭"],["トライセプスプレスダウン","2","10–15","60秒","三頭"]]]

];

const KEY="HBL";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{i:0,logs:[],sessions:[]};
if(!Array.isArray(S.logs))S.logs=[];
if(!Array.isArray(S.sessions))S.sessions=[];

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date();
const dateText=d=>new Date(d).toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const dateKey=d=>new Date(d).toLocaleDateString("ja-JP");
function last(n){return S.logs.find(x=>x.n===n)}
function currentPlan(){return P[S.i%P.length]}

function render(){
  let p=currentPlan();
  let h=`<div class="card"><div class="tag">DAY ${p[0]} / ${p[1]}</div><h2>${p[2]}</h2><div class="muted">${p[3]}</div></div>`;
  if(!p[4].length){
    h+=`<div class="card"><div class="empty">今日は回復日です。疲れていれば完全休養でOK。</div>
    <button class="primary" style="width:100%" onclick="completeRest()">回復日を完了 → 次へ</button></div>`;
  }else{
    h+=`<div class="card"><div class="muted">重量は自分で調整。「指定回数＋RIR 1–3」を基本にしてください。</div>`;
    p[4].forEach((e,j)=>{
      let l=last(e[0]);
      h+=`<div class="ex">
        <div class="exhead"><b>${esc(e[0])}</b><span class="target">${esc(e[2])}</span></div>
        <div class="note">${esc(e[4])}　休憩 ${esc(e[3])}${l?"｜前回 "+esc(l.d):""}</div>
        <div class="grid">
          <label>重量/結果<input id="w${j}" placeholder="${p[1]=="筋トレ"?"kg":"結果"}"></label>
          <label>回数/時間<input id="r${j}" placeholder="${esc(e[2])}"></label>
          <label>RIR/RPE<input id="q${j}" placeholder="${p[1]=="筋トレ"?"例 2":"例 5"}"></label>
        </div>
      </div>`;
    });
    h+=`<label>メモ<textarea id="m" placeholder="体調・痛み・気づいたこと"></textarea></label>
    <button class="primary" style="width:100%;margin-top:12px" onclick="done()">記録して完了 →</button></div>`;
  }
  document.getElementById("today").innerHTML=h;
}

function done(){
  const p=currentPlan(), ts=now(), memo=document.getElementById("m")?.value||"";
  const entries=[];
  p[4].forEach((e,j)=>{
    const a=document.getElementById("w"+j)?.value.trim()||"";
    const b=document.getElementById("r"+j)?.value.trim()||"";
    const c=document.getElementById("q"+j)?.value.trim()||"";
    if(a||b||c){
      const d=(a?a+" × ":"")+b+(c?" / RIR・RPE "+c:"");
      const log={date:ts.toISOString(),day:p[0],type:p[1],plan:p[2],n:e[0],d,m:memo};
      S.logs.unshift(log); entries.push(log);
    }
  });
  if(entries.length||memo){
    S.sessions.unshift({date:ts.toISOString(),day:p[0],type:p[1],plan:p[2],memo,entries});
  }
  next();
}

function completeRest(){
  const p=currentPlan(),ts=now();
  S.sessions.unshift({date:ts.toISOString(),day:p[0],type:p[1],plan:p[2],memo:"回復日",entries:[]});
  next();
}
function next(){S.i=(S.i+1)%P.length;save();render()}

function history(){
  const h=S.sessions.length ? S.sessions.slice(0,40).map((s,idx)=>{
    const rows=s.entries.map(x=>`<div>${esc(x.n)}：${esc(x.d)}</div>`).join("");
    return `<div class="history"><b>DAY ${esc(s.day)} / ${esc(s.plan)}</b><br>${rows||"回復日"}<br><span class="muted">${dateText(s.date)}${s.memo?"｜"+esc(s.memo):""}</span></div>`;
  }).join("") : `<div class="empty">まだ記録がありません。</div>`;
  document.getElementById("history").innerHTML=`<div class="card"><h2>最近の記録</h2>${h}</div>`;
}

function makeChatGPTText(){
  const recent=S.sessions.slice(0,20);
  let out=`Hybrid Body Log 記録（ChatGPTフィードバック用）\n`;
  out+=`現在のDAY：${currentPlan()[0]} / ${currentPlan()[2]}\n`;
  out+=`記録セッション数：${S.sessions.length}\n\n`;
  if(!recent.length)return out+"まだ記録がありません。";
  recent.forEach(s=>{
    out+=`【${dateText(s.date)}｜DAY ${s.day} ${s.plan}】\n`;
    if(s.entries.length){
      s.entries.forEach(x=>out+=`- ${x.n}: ${x.d}\n`);
    }else out+="- 回復日\n";
    if(s.memo)out+=`- メモ: ${s.memo}\n`;
    out+="\n";
  });
  out+=`フィードバックでは、前回比・重量設定・RIR/RPE・疲労・筋トレとランニングのバランス・次回の重量目安を評価してください。`;
  return out;
}

async function copyChatGPT(){
  const text=makeChatGPTText();
  try{
    await navigator.clipboard.writeText(text);
    alert("ChatGPT用の記録をコピーしました。このチャットに貼り付けてください。");
  }catch(e){
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    alert("ChatGPT用の記録をコピーしました。");
  }
}

async function shareChatGPT(){
  const text=makeChatGPTText();
  if(navigator.share){
    try{await navigator.share({title:"Hybrid Body Log 記録",text});}catch(e){}
  }else{
    await copyChatGPT();
  }
}

function data(){
  const recent=S.sessions.length;
  document.getElementById("data").innerHTML=`
  <div class="card">
    <h2>ChatGPTフィードバック</h2>
    <p class="muted">トレーニング後にここから記録をコピー／共有して、このチャットに送ってください。</p>
    <div class="row">
      <button class="primary" onclick="shareChatGPT()">共有</button>
      <button class="secondary" onclick="copyChatGPT()">コピー</button>
    </div>
    <p class="small muted">${recent}セッション保存中</p>
    <details><summary>送信される内容を確認</summary><div class="sharebox" style="margin-top:8px">${esc(makeChatGPTText())}</div></details>
  </div>
  <div class="card">
    <h2>バックアップ</h2>
    <div class="row">
      <button onclick="backup()">書き出す</button>
      <button onclick="document.getElementById('file').click()">復元</button>
      <input id="file" type="file" accept=".json,application/json" style="display:none" onchange="restore(event)">
    </div>
    <p class="muted">記録はこのSafariに保存されます。機種変更やSafariのデータ削除に備えて、定期的にバックアップしてください。</p>
    <button class="danger" style="width:100%" onclick="reset()">全削除</button>
  </div>`;
}

function backup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hybrid-body-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restore(ev){
  const file=ev.target.files?.[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x||!Array.isArray(x.logs))throw new Error();
      if(!confirm("現在の記録をバックアップで置き換えますか？"))return;
      S=x;if(!Array.isArray(S.sessions))S.sessions=[];
      save();location.reload();
    }catch(e){alert("バックアップの読み込みに失敗しました。");}
  };
  r.readAsText(file);
}
function reset(){
  if(confirm("全記録を削除しますか？\nこの操作は元に戻せません。")){
    localStorage.removeItem(KEY);location.reload();
  }
}
function tab(x,b){
  ["today","history","data"].forEach(id=>document.getElementById(id).style.display=id==x?"block":"none");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  if(x=="history")history();if(x=="data")data();
}
render();
</script>
</body>
</html>
